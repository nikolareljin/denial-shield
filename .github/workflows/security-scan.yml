name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy scan
        # yamllint disable rule:line-length
        uses: nikolareljin/ci-helpers/.github/actions/trivy-scan@b5c8ac82ce3ce84f30ca3aa389c9075075dcab6a
        # yamllint enable rule:line-length
        with:
          upload_sarif: ${{ github.event.pull_request.head.repo.fork != true }}
