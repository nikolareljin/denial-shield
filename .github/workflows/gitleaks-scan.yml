name: Gitleaks Scan

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action scans commit history. Shallow checkouts can omit
          # commits it needs to inspect.
          fetch-depth: 0
      - name: Gitleaks scan
        # yamllint disable rule:line-length
        uses: nikolareljin/ci-helpers/.github/actions/gitleaks-scan@b5c8ac82ce3ce84f30ca3aa389c9075075dcab6a
        # yamllint enable rule:line-length
